# Render blueprint — free deploy, no Docker.
# One repo → two services: the public honeypot and the protected dashboard.
# Database: Supabase (free). LLM: Groq (free API key) — Ollama cannot run on a free tier.
services:
  # ── The public FAKE site ────────────────────────────────────────────────
  - type: web
    name: honeypod-honeypot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE
        value: honeypot
      - key: DATABASE_URL
        sync: false # set it in the Render dashboard (Supabase pooled, :6543)
      - key: DIRECT_URL
        sync: false # Supabase direct, :5432

  # ── The dashboard (API + UI), protected by HTTP Basic auth ──────────────
  - type: web
    name: honeypod-dashboard
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE
        value: dashboard
      - key: DASHBOARD_USER
        sync: false # required — the dashboard is public on Render
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
